<mat-toolbar-row>
  <div class="flex justify-end items-center gap-2 w-full p-4">
    <button matButton="filled" routerLink="/"><mat-icon>home</mat-icon> Home</button>

    @if (!authentification.isAuthenticated()) {
      <button matButton="filled" routerLink="/login"><mat-icon>login</mat-icon> Login</button>
      <button matButton="filled" routerLink="/register">Register</button>
    }

    @if (authentification.isAuthenticated()) {
      <button matButton="filled" (click)="logout()"><mat-icon>logout</mat-icon> Logout</button>
    }
  </div>
</mat-toolbar-row>

<div class="max-w-4xl mx-auto mt-12 p-6 text-center">
  <h1 class="text-4xl font-bold text-gray-800 mb-4">Welcome Home</h1>
  <p class="text-lg text-gray-600 mb-8">
    This is your application dashboard.
  </p>

  @if (authentification.isAuthenticated()) {
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl inline-block font-medium">
      You are currently authenticated.
    </div>
  } @else {
    <div class="bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl inline-block font-medium">
      Please log in or register to get started.
    </div>
  }
</div>
