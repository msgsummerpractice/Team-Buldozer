<div class="flex flex-col lg:flex-row lg:items-start">
  <aside
    class="relative w-full shrink-0 overflow-hidden lg:sticky lg:top-16 lg:h-[calc(100vh-4rem)] lg:w-72 xl:w-80"
  >
    <img
      [src]="image()"
      alt=""
      aria-hidden="true"
      class="absolute inset-0 h-full w-full object-cover"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/45 to-black/20"></div>
    <div
      class="relative flex min-h-44 flex-col justify-end p-6 text-white lg:h-full lg:justify-center lg:p-8 lg:pb-[30vh]"
    >
      <h1 class="text-3xl font-bold leading-tight lg:text-4xl">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="mt-3 text-sm text-white/85 lg:text-base">{{ subtitle() }}</p>
      }
      <ng-content select="[sidebar-actions]" />
    </div>
  </aside>

  <main class="min-w-0 flex-1 p-4 md:p-6 lg:p-8">
    <ng-content />
  </main>
</div>
