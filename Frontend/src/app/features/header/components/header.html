<mat-toolbar class="app-toolbar sticky top-0 z-50">
  <div class="flex justify-between items-center w-full h-full px-4">
    <a routerLink="/" class="flex items-center gap-2 no-underline h-8 py-2">
      <img src="assets/images/msg_logo.png" alt="logo" class="h-8 logo-white" />
    </a>

    <div class="flex justify-between items-center w-full h-full px-4">
      <button *rolesAssigned="'ADMIN'" matButton routerLink="/users">
        {{ 'users.title' | transloco }}
      </button>
      <button *appAuth matButton routerLink="/events"> {{ 'events.title' | transloco }} </button>
    </div>

    <div class="flex items-center gap-3">
      <button
        *appAuth
        matIconButton
        (click)="logout()"
        [matTooltip]="'home.nav.logout' | transloco"
      >
        <mat-icon>logout</mat-icon>
      </button>

      @if (!isAuthenticated()) {
      <button matIconButton routerLink="/login" [matTooltip]="'home.nav.login' | transloco">
        <mat-icon>login</mat-icon>
      </button>
      } @else {
      <button
        matIconButton
        [routerLink]="profileLink()"
        [matTooltip]="'home.nav.profile' | transloco"
      >
        <mat-icon>person</mat-icon>
      </button>
      }

      <button
        (click)="toggleLang()"
        class="lang-flag-btn"
        [matTooltip]="activeLang() === 'en' ? 'Schimbă în Română' : 'Switch to English'"
      >
        @if (activeLang() === 'en') {
        <img src="https://flagcdn.com/gb.svg" alt="English" />
        } @else {
        <img src="https://flagcdn.com/ro.svg" alt="Română" />
        }
      </button>
    </div>
  </div>
</mat-toolbar>
