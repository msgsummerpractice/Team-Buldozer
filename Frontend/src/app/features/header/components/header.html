<mat-toolbar class="sticky top-0 z-50">
  <div class="flex justify-end items-center gap-1 w-full px-4 py-2">
    <button mat-icon-button routerLink="/" [matTooltip]="'nav.home' | transloco">
      <mat-icon>home</mat-icon>
    </button>

    <button mat-stroked-button (click)="toggleLang()" class="min-w-0 px-3">
      {{ nextLang().toUpperCase() }}
    </button>

    @if (!authentification.isAuthenticated()) {
    <button mat-icon-button routerLink="/login" [matTooltip]="'nav.login' | transloco">
      <mat-icon>person</mat-icon>
    </button>
    } @if (authentification.isAuthenticated()) {
    <button mat-icon-button (click)="logout()" [matTooltip]="'nav.logout' | transloco">
      <mat-icon>logout</mat-icon>
    </button>
    }
  </div>
</mat-toolbar>
