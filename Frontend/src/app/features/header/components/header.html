<mat-toolbar class="app-toolbar justify-between sticky top-0 z-50 px-6">
  <div class="logo-container">
    <a routerLink="/" class="no-underline">
      <img src="assets/images/msg_logo.png" alt="logo" class="object-contain logo-white" />
    </a>
  </div>

  <!-- Desktop navigation -->
  <div class="hidden md:flex items-center px-4">
    <button routerLinkActive="nav-link-active" routerLink="/home" matButton>
      {{ 'home.title' | transloco }}
    </button>
    <button
      routerLinkActive="nav-link-active"
      *rolesAssigned="roles.ADMIN"
      matButton
      routerLink="/users"
    >
      {{ 'users.title' | transloco }}
    </button>
    <button routerLinkActive="nav-link-active" *appAuth matButton routerLink="/events">
      {{ 'events.title' | transloco }}
    </button>
  </div>

  <!-- Desktop actions -->
  <div class="hidden md:flex items-center gap-3">
    <button *appAuth matIconButton (click)="logout()" [matTooltip]="'home.nav.logout' | transloco">
      <mat-icon>logout</mat-icon>
    </button>

    @if (!isAuthenticated()) {
      <button matIconButton routerLink="/login" [matTooltip]="'home.nav.login' | transloco">
        <mat-icon>login</mat-icon>
      </button>
    } @else {
      <button
        matIconButton
        [routerLink]="profileLink()"
        [matTooltip]="'home.nav.profile' | transloco"
      >
        <mat-icon>person</mat-icon>
      </button>
    }

    <button (click)="toggleLang()" class="lang-flag-btn" [matTooltip]="'toggle-lang' | transloco">
      @if (activeLang() === 'en') {
        <img src="https://flagcdn.com/gb.svg" alt="English" />
      } @else {
        <img src="https://flagcdn.com/ro.svg" alt="Română" />
      }
    </button>
  </div>

  <!-- Mobile menu -->
  <div class="md:hidden">
    <button
      matIconButton
      [matMenuTriggerFor]="mobileMenu"
      [attr.aria-label]="'home.nav.menu' | transloco"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #mobileMenu="matMenu">
      <button mat-menu-item routerLink="/home">
        <mat-icon>home</mat-icon>
        <span>{{ 'home.title' | transloco }}</span>
      </button>
      <button *rolesAssigned="roles.ADMIN" mat-menu-item routerLink="/users">
        <mat-icon>group</mat-icon>
        <span>{{ 'users.title' | transloco }}</span>
      </button>
      <button *appAuth mat-menu-item routerLink="/events">
        <mat-icon>event</mat-icon>
        <span>{{ 'events.title' | transloco }}</span>
      </button>

      <mat-divider></mat-divider>

      @if (!isAuthenticated()) {
        <button mat-menu-item routerLink="/login">
          <mat-icon>login</mat-icon>
          <span>{{ 'home.nav.login' | transloco }}</span>
        </button>
      } @else {
        <button mat-menu-item [routerLink]="profileLink()">
          <mat-icon>person</mat-icon>
          <span>{{ 'home.nav.profile' | transloco }}</span>
        </button>
      }
      <button *appAuth mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ 'home.nav.logout' | transloco }}</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="toggleLang()">
        <mat-icon>language</mat-icon>
        <span>{{ 'toggle-lang' | transloco }}</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
