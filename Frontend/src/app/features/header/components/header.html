<mat-toolbar class="app-toolbar justify-between sticky top-0 z-50 px-4">
  <a routerLink="/" class="no-underline">
    <img src="assets/images/msg_logo.png" alt="logo" class="h-8 logo-white" />
  </a>

  <div class="flex items-center px-4">
    <button matButton routerLinkActive="nav-link-active" routerLink="/home">
      {{ 'home.nav.home' | transloco }}
    </button>
    <button
      *rolesAssigned="roles.ADMIN"
      matButton
      routerLinkActive="nav-link-active"
      routerLink="/users"
    >
      {{ 'users.title' | transloco }}
    </button>
    <button matButton routerLinkActive="nav-link-active" routerLink="/events/list">
      {{ 'events.title' | transloco }}
    </button>
  </div>

  <div class="flex items-center gap-3">
    <button *appAuth matIconButton (click)="logout()" [matTooltip]="'home.nav.logout' | transloco">
      <mat-icon>logout</mat-icon>
    </button>

    @if (!isAuthenticated()) {
      <button matIconButton routerLink="/login" [matTooltip]="'home.nav.login' | transloco">
        <mat-icon>login</mat-icon>
      </button>
    } @else {
      <button
        matIconButton
        [routerLink]="profileLink()"
        [matTooltip]="'home.nav.profile' | transloco"
      >
        <mat-icon>person</mat-icon>
      </button>
    }

    <button (click)="toggleLang()" class="lang-flag-btn" [matTooltip]="'toggle-lang' | transloco">
      @if (activeLang() === 'en') {
        <img src="https://flagcdn.com/gb.svg" alt="English" />
      } @else {
        <img src="https://flagcdn.com/ro.svg" alt="Română" />
      }
    </button>
  </div>
</mat-toolbar>
