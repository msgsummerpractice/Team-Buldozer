<h2 mat-dialog-title class="font-bold! subhead-color-secondary! whitespace-nowrap!">
  {{ 'users.manage-roles' | transloco }}
  <span class="font-normal text-black ml-1">
    — {{ data.user.firstName }} {{ data.user.lastName }}
  </span>
</h2>

<mat-dialog-content>
  <div class="py-2 min-w-64">
    <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
      <mat-label>{{ 'users.roles' | transloco }}</mat-label>
      <mat-select [formControl]="rolesControl" multiple>
        @for (role of UserRoles; track role) {
          <mat-option [value]="role" [disabled]="isOnlySelected(role) || isConflictingRole(role)">
            {{ role }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
  <button matButton="filled" color="primary" cdkFocusInitial (click)="save()">
    <mat-icon>save</mat-icon>
    {{ 'users.save' | transloco }}
  </button>
</mat-dialog-actions>
