<h2 mat-dialog-title class="font-bold! subhead-color-secondary! whitespace-nowrap!">
  {{ 'users.manage-roles' | transloco }}
  <span class="font-normal text-black ml-1">
    — {{ data.user.firstName }} {{ data.user.lastName }}
  </span>
</h2>

<mat-dialog-content>
  <div class="flex flex-col gap-4 py-2 min-w-64">
    @for (role of UserRoles; track role) {
    <mat-checkbox
      color="primary"
      [checked]="isSelected(role)"
      (change)="toggle(role, $event.checked)"
    >
      {{ role }}
    </mat-checkbox>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
  <button matButton="filled" color="primary" cdkFocusInitial (click)="save()">
    <mat-icon>save</mat-icon>
    {{ 'users.save' | transloco }}
  </button>
</mat-dialog-actions>
