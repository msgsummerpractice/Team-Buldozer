<mat-toolbar-row>
  <div class="flex justify-end items-center gap-1 w-full px-4 py-2">
    <button mat-icon-button routerLink="/" [matTooltip]="'home.nav.home' | transloco">
      <mat-icon>home</mat-icon>
    </button>

    <button mat-stroked-button (click)="toggleLang()" class="min-w-0 px-3">
      {{ nextLang().toUpperCase() }}
    </button>

    @if (!authentification.isAuthenticated()) {
    <button mat-icon-button routerLink="/login" [matTooltip]="'home.nav.login' | transloco">
      <mat-icon>person</mat-icon>
    </button>
    } @if (authentification.isAuthenticated()) {
    <button mat-icon-button (click)="logout()" [matTooltip]="'home.nav.logout' | transloco">
      <mat-icon>logout</mat-icon>
    </button>
    }
  </div>
</mat-toolbar-row>

<div class="max-w-4xl mx-auto mt-12 p-6 text-center">
  <h1 class="text-4xl font-bold text-gray-800 mb-4">{{ 'home.title' | transloco }}</h1>
  <p class="text-lg text-gray-600 mb-8">{{ 'home.subtitle' | transloco }}</p>

  @if (authentification.isAuthenticated()) {
  <div
    class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl inline-block font-medium"
  >
    {{ 'home.authenticatedMsg' | transloco }}
  </div>
  } @else {
  <div
    class="bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl inline-block font-medium"
  >
    {{ 'home.unauthenticatedMsg' | transloco }}
  </div>
  }
</div>
