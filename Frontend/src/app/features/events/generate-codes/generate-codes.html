<app-page-layout [title]="'events.generate-codes.title' | transloco">
  <div class="mx-auto max-w-2xl">
  @if (error()) {
    <div class="flex flex-col items-center gap-4 py-12 text-center">
      <mat-icon class="!text-[48px] text-red-500">error_outline</mat-icon>
      <p>{{ 'events.generate-codes.error' | transloco }}</p>
      <button matButton="text" [routerLink]="['/events/list']">
        <mat-icon>arrow_back</mat-icon>
        {{ 'events.generate-codes.back' | transloco }}
      </button>
    </div>
  } @else if (codes(); as data) {
    <div class="flex flex-col gap-6 items-center">
      <mat-card appearance="raised" class="w-full">
        <mat-card-content class="flex flex-col items-center gap-6 py-8">
          <div class="flex flex-col items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-widest opacity-60">
              {{ 'events.generate-codes.check-in-code' | transloco }}
            </span>
            <span class="text-5xl font-bold tracking-widest font-mono">{{ data.checkInCode }}</span>
          </div>

          <mat-divider class="w-full" />

          <div class="flex flex-col items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-widest opacity-60">
              {{ 'events.generate-codes.qr-code' | transloco }}
            </span>
            <img [src]="qrCodeSrc()" alt="QR Code" class="w-48 h-48 rounded-xl shadow" />
          </div>
        </mat-card-content>
      </mat-card>

      <button matButton="text" [routerLink]="['/events/list']">
        <mat-icon>arrow_back</mat-icon>
        {{ 'events.generate-codes.back' | transloco }}
      </button>
    </div>
  }
  </div>
</app-page-layout>
