<h2 mat-dialog-title>{{ 'profile.picture.cropper.title' | transloco }}</h2>

<mat-dialog-content class="flex flex-col gap-4 min-w-80">
  <p class="text-sm text-slate-500">{{ 'profile.picture.cropper.hint' | transloco }}</p>

  <div class="flex items-center gap-3">
    <button mat-stroked-button color="primary" type="button" (click)="fileInput.click()">
      <mat-icon>upload</mat-icon>
      {{ 'profile.picture.cropper.select' | transloco }}
    </button>
    <input
      #fileInput
      type="file"
      accept="image/*"
      class="hidden"
      (change)="fileChangeEvent($event)"
    />
  </div>

  @if (imageChangedEvent()) {
  <div class="rounded-xl overflow-hidden border border-slate-200 bg-slate-50">
    <image-cropper
      [imageChangedEvent]="imageChangedEvent()"
      [maintainAspectRatio]="true"
      [aspectRatio]="1 / 1"
      [roundCropper]="false"
      output="base64"
      format="jpeg"
      (imageCropped)="onImageCropped($event)"
      (imageLoaded)="onImageLoaded()"
      class="block"
    />
  </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ 'profile.picture.cropper.cancel' | transloco }}
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!croppedBase64()"
    (click)="confirm()"
  >
    {{ 'profile.picture.cropper.confirm' | transloco }}
  </button>
</mat-dialog-actions>
