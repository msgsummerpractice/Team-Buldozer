<button
  (click)="translocoService.setActiveLang(translocoService.getActiveLang() === 'en' ? 'ro' : 'en')"
  class="fixed top-4 right-4 z-50 px-3 py-1.5 rounded-lg border border-gray-300 bg-white text-sm font-semibold text-gray-700 shadow hover:bg-gray-100 transition"
>
  {{ (translocoService.getActiveLang() === 'en' ? 'ro' : 'en').toUpperCase() }}
</button>

<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 border border-gray-100">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6"
      >{{ 'login.title' | transloco }}</h2
    >

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >{{ 'login.username' | transloco }}</label
        >
        <input
          formControlName="username"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >{{ 'login.password' | transloco }}</label
        >
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:ring-2 focus:ring-blue-500 outline-none"
        />
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition disabled:bg-gray-300"
      >
        {{ 'login.submit' | transloco }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      {{ 'login.noAccount' | transloco }}
      <a routerLink="/register" class="text-blue-600 font-semibold hover:underline"
        >{{ 'login.register' | transloco }}</a
      >
    </p>
  </div>
</div>
